# Builds the site and publishes it on GitHub Pages (free hosting).
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # weekly, to pick up piste & lift edits from OpenStreetMap
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pre-bake pistes & lifts from OpenStreetMap
        run: npm run fetch-osm
        continue-on-error: true # the app falls back to live Overpass queries
      - run: npm run build
        env:
          # Optional extras, set under Settings → Secrets and variables → Actions → Variables.
          VITE_SE_ORTHO_URL: ${{ vars.VITE_SE_ORTHO_URL }}
          VITE_DEM_LAYERS: ${{ vars.VITE_DEM_LAYERS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
